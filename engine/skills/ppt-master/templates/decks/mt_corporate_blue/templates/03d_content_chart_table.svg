<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1280" height="720" viewBox="0 0 1280 720"
  data-pptx-master="mt_master" data-pptx-master-name="MT Corporate Master"
  data-pptx-layout="mt_content_chart_table" data-pptx-layout-name="MT 正文 - 数据">
  <defs>
    <linearGradient id="header-blue" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0" stop-color="#004696"/>
      <stop offset="1" stop-color="#3399FF"/>
    </linearGradient>
  </defs>
  <rect id="master-bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="chart-table-header" x="0" y="0" width="1280" height="80" fill="url(#header-blue)"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <image id="chart-table-logo" href="../images/mt_header_logo.png" x="1084.4" y="51" width="127.2" height="14.5"
    preserveAspectRatio="none" data-pptx-layer="layout" data-pptx-editable="false"/>
  <line id="chart-table-page-divider" x1="1225.4" y1="49" x2="1225.4" y2="79.3" stroke="#FFFFFF" stroke-width="0.67"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="chart-table-visual-frame" x="55" y="165" width="1170" height="320" fill="#F4F8FC" stroke="#97CBFF" stroke-width="2"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="chart-table-detail-frame" x="55" y="510" width="1170" height="130" fill="#FFFFFF" stroke="#97CBFF" stroke-width="2"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <text id="chart-table-footer" x="1226" y="712" text-anchor="end" font-family="Arial, 黑体, sans-serif" font-size="10.67" fill="#7A7A7A"
    data-pptx-layer="layout" data-pptx-editable="false">For internal use - Confidential</text>
  <g id="chart-table-title-slot" data-pptx-placeholder="title" data-pptx-bounds="55 20 950 60">
    <text id="chart-table-title-carrier" data-pptx-carrier="true" x="55" y="64"
      font-family="Arial, 黑体, sans-serif" font-size="32" fill="#FFFFFF">{{PAGE_TITLE}}</text>
  </g>
  <g id="chart-table-key-slot" data-pptx-placeholder="subtitle" data-pptx-idx="1" data-pptx-bounds="55 101 1170 42">
    <text id="chart-table-key-carrier" data-pptx-carrier="true" x="55" y="132"
      font-family="Arial, 黑体, sans-serif" font-size="24" font-weight="bold" fill="#56A410">{{KEY_MESSAGE}}</text>
  </g>
  <g id="chart-table-visual-slot" data-pptx-placeholder="body" data-pptx-idx="2" data-pptx-bounds="75 185 1130 280">
    <text id="chart-table-visual-carrier" data-pptx-carrier="true" x="640" y="335" text-anchor="middle"
      font-family="Arial, 黑体, sans-serif" font-size="21.33" fill="#004696">{{DATA_VISUAL}}</text>
  </g>
  <g id="chart-table-detail-slot" data-pptx-placeholder="body" data-pptx-idx="3" data-pptx-bounds="75 530 1130 90">
    <text id="chart-table-detail-carrier" data-pptx-carrier="true" x="640" y="584" text-anchor="middle"
      font-family="Arial, 黑体, sans-serif" font-size="18.67" fill="#1F2937">{{DATA_DETAIL}}</text>
  </g>
  <g id="chart-table-page-num-slot" data-pptx-placeholder="slide-number" data-pptx-idx="9" data-pptx-bounds="1225 34 55 45">
    <text id="chart-table-page-num-carrier" data-pptx-carrier="true" x="1235" y="63"
      font-family="Arial, 黑体, sans-serif" font-size="18.67" fill="#FFFFFF">{{PAGE_NUM}}</text>
  </g>
</svg>
