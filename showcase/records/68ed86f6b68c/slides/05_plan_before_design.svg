<g id="claim" data-pptx-bounds="55 100 1170 60"><text x="55" y="136" font-size="24" font-weight="bold" fill="#56A410">Solve “what the deck must say” before “how each page should look”</text></g>
<g id="understand-loop" data-pptx-bounds="55 180 480 390"><rect x="55" y="180" width="480" height="390" fill="#97CBFF" fill-opacity="0.25" stroke="#004696" stroke-width="2" /><text x="85" y="224" font-size="21.33" font-weight="bold" fill="#004696">UNDERSTAND + PLAN</text><circle cx="132" cy="302" r="34" fill="#004696" /><text x="132" y="310" text-anchor="middle" font-size="21.33" font-weight="bold" fill="#FFFFFF">1</text><text x="188" y="292" font-size="19.33" fill="#1F2937">Read audience, facts, purpose</text><text x="188" y="322" font-size="16" fill="#7A7A7A">Identify the communication job</text><circle cx="132" cy="404" r="34" fill="#3399FF" /><text x="132" y="412" text-anchor="middle" font-size="21.33" font-weight="bold" fill="#FFFFFF">2</text><text x="188" y="394" font-size="19.33" fill="#1F2937">Retain, merge, compare, visualize</text><text x="188" y="424" font-size="16" fill="#7A7A7A">Turn material into narrative decisions</text><circle cx="132" cy="506" r="34" fill="#56A410" /><text x="132" y="514" text-anchor="middle" font-size="21.33" font-weight="bold" fill="#FFFFFF">3</text><text x="188" y="496" font-size="21.33" fill="#1F2937">Author a page-by-page plan</text><text x="188" y="526" font-size="16" fill="#7A7A7A">Title · task · claim · support · visual</text></g>
<g id="checkpoint" data-pptx-bounds="555 240 170 260"><line x1="535" y1="375" x2="568" y2="375" stroke="#3399FF" stroke-width="4" marker-end="url(#arr)" /><polygon points="640,240 725,375 640,510 555,375" fill="#FFFFFF" stroke="#56A410" stroke-width="5" /><text x="640" y="350" text-anchor="middle" font-size="21.33" font-weight="bold" fill="#004696">EDITABLE</text><text x="640" y="382" text-anchor="middle" font-size="21.33" font-weight="bold" fill="#004696">OUTLINE</text><text x="640" y="420" text-anchor="middle" font-size="16" fill="#56A410">human checkpoint</text></g>
<g id="produce-loop" data-pptx-bounds="745 180 480 390"><line x1="712" y1="375" x2="750" y2="375" stroke="#3399FF" stroke-width="4" marker-end="url(#arr)" /><rect x="745" y="180" width="480" height="390" fill="#004696" /><text x="775" y="224" font-size="21.33" font-weight="bold" fill="#FFFFFF">DESIGN + PRODUCE</text><rect x="775" y="265" width="420" height="66" fill="#FFFFFF" /><text x="797" y="305" font-size="21.33" fill="#004696">Create isolated project workspace</text><rect x="775" y="348" width="420" height="66" fill="#97CBFF" /><text x="797" y="388" font-size="21.33" fill="#004696">Apply brand and design rules</text><rect x="775" y="431" width="420" height="66" fill="#BEF38E" /><text x="797" y="471" font-size="21.33" fill="#004696">Author, inspect, validate, export</text><text x="775" y="542" font-size="16" fill="#FFFFFF">The confirmed plan becomes the production contract.</text></g>
<g id="edit-options" data-pptx-bounds="55 590 1170 65"><text x="55" y="627" font-size="16" fill="#7A7A7A">Human actions before production:</text><text x="282" y="627" font-size="16" font-weight="bold" fill="#004696">Edit title</text><text x="424" y="627" font-size="16" font-weight="bold" fill="#004696">Add / delete</text><text x="592" y="627" font-size="16" font-weight="bold" fill="#004696">Reorder</text><text x="718" y="627" font-size="16" font-weight="bold" fill="#004696">Regenerate structure</text><text x="950" y="627" font-size="16" font-weight="bold" fill="#56A410">or skip when already clear</text></g><text id="footer" data-pptx-role="footer" x="1226" y="707" font-size="10.67" text-anchor="end" fill="#7A7A7A">For internal use - Confidential</text></svg>