<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>翻页预览 - PPT Generator</title>
<style>
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #0e0f10; color: #f0f0ec;
  display: flex; flex-direction: column; min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: transparent; border: 0; cursor: pointer; }

.bar {
  display: flex; align-items: center; gap: 14px;
  padding: 14px clamp(16px, 3vw, 32px);
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.back {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 13px; border: 1px solid rgba(255,255,255,.16); border-radius: 999px;
  font-size: 12px; color: #c9c9c4; transition: all .15s ease; white-space: nowrap;
}
.back:hover { background: rgba(255,255,255,.08); color: #fff; }
.meta { min-width: 0; flex: 1; }
.meta b { display: block; font-size: 14px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta small { display: block; margin-top: 2px; color: #8f8f8a; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.counter { color: #9a9a95; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }

.stage {
  flex: 1; min-height: 0; position: relative;
  display: grid; place-items: center;
  padding: clamp(12px, 2.5vh, 26px) clamp(56px, 7vw, 90px);
  user-select: none;
}
.stage img {
  max-width: 100%; max-height: calc(100vh - 190px);
  aspect-ratio: 16/9; object-fit: contain;
  border-radius: 10px; background: #fff;
  box-shadow: 0 30px 90px rgba(0,0,0,.55);
}
.hotzone { position: absolute; top: 0; bottom: 0; width: 34%; cursor: pointer; }
.hotzone.l { left: 0; } .hotzone.r { right: 0; }

.navbtn {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center;
  background: rgba(255,255,255,.07); color: #ddd;
  font-size: 19px; transition: all .15s ease; z-index: 2;
}
.navbtn:hover { background: rgba(255,255,255,.16); color: #fff; }
.navbtn.l { left: clamp(10px, 1.6vw, 26px); }
.navbtn.r { right: clamp(10px, 1.6vw, 26px); }
.navbtn[disabled] { opacity: .25; cursor: default; }

.foot { padding: 0 clamp(16px, 3vw, 32px) 16px; text-align: center; }
.caption { min-height: 18px; color: #a8a8a3; font-size: 12px; margin-bottom: 10px; }
.dots { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.18); padding: 0; transition: all .15s ease; }
.dot:hover { background: rgba(255,255,255,.45); }
.dot.on { background: #fff; transform: scale(1.25); }

.err { color: #d98a84; font-size: 13px; }
@media (max-width: 700px) {
  .stage { padding-left: 14px; padding-right: 14px; }
  .navbtn { display: none; }
  .meta small { display: none; }
}
</style>
</head>
<body>
<div class="bar">
  <a class="back" href="./">← 返回生成台</a>
  <div class="meta"><b id="title">加载中…</b><small id="sub"></small></div>
  <span class="counter" id="counter"></span>
</div>
<div class="stage" id="stage">
  <button class="navbtn l" id="prevBtn" aria-label="上一页">‹</button>
  <img id="slide" alt="幻灯片页面">
  <button class="navbtn r" id="nextBtn" aria-label="下一页">›</button>
  <div class="hotzone l" id="hzL" title="上一页"></div>
  <div class="hotzone r" id="hzR" title="下一页"></div>
</div>
<div class="foot">
  <div class="caption" id="caption"></div>
  <div class="dots" id="dots"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const id = new URLSearchParams(location.search).get('id') || '';
let ex = null, cur = 0;

const url = f => `examples/${encodeURIComponent(ex.id)}/${encodeURIComponent(f)}`;

function show(i) {
  if (!ex) return;
  cur = Math.max(0, Math.min(ex.slides.length - 1, i));
  const s = ex.slides[cur];
  $('#slide').src = url(s.file);
  $('#caption').textContent = s.desc || '';
  $('#counter').textContent = `${cur + 1} / ${ex.slides.length}`;
  $('#prevBtn').disabled = cur === 0;
  $('#nextBtn').disabled = cur === ex.slides.length - 1;
  document.querySelectorAll('.dot').forEach((d, j) => d.classList.toggle('on', j === cur));
  if (cur + 1 < ex.slides.length) new Image().src = url(ex.slides[cur + 1].file);  // 预加载下一页
}

fetch('api/examples').then(r => r.json()).then(list => {
  ex = list.find(e => e.id === id);
  if (!ex) {
    $('#title').textContent = '历史示例已下线';
    $('#title').className = 'err';
    $('#sub').textContent = '当前产品只提供 MT 公司最终模板';
    return;
  }
  document.title = `${ex.title} · 翻页预览 - PPT Generator`;
  $('#title').textContent = `${ex.title} · ${ex.styleName}`;
  $('#sub').textContent = `${ex.description}`;
  $('#dots').innerHTML = ex.slides.map((s, j) =>
    `<button class="dot" data-i="${j}" title="第 ${j + 1} 页"></button>`).join('');
  document.querySelectorAll('.dot').forEach(d => d.onclick = () => show(+d.dataset.i));
  show(0);
}).catch(() => {
  $('#title').textContent = '加载失败';
  $('#title').className = 'err';
});

$('#prevBtn').onclick = () => show(cur - 1);
$('#nextBtn').onclick = () => show(cur + 1);
$('#hzL').onclick = () => show(cur - 1);
$('#hzR').onclick = () => show(cur + 1);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') show(cur - 1);
  else if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); show(cur + 1); }
  else if (e.key === 'Escape') location.href = './';
});
let touchX = null;
document.addEventListener('touchstart', e => touchX = e.touches[0].clientX, {passive: true});
document.addEventListener('touchend', e => {
  if (touchX == null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 40) show(cur + (dx < 0 ? 1 : -1));
  touchX = null;
}, {passive: true});
</script>
</body>
</html>
